<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZenSai · เมนู &amp; บริการ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#FBF6EC; --card:#FFFFFF; --ink:#2B1D14; --muted:#6B5B4E;
    --line:#E7DCC6; --chip:#F6EFE2; --accent:#8E1F1F; --accent-dark:#5E1212;
    --gold:#E3C27A; --thumb:#EADBC0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Sans Thai',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit;cursor:pointer}
  .serif{font-family:'Noto Serif Thai',serif}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  header{position:sticky;top:0;z-index:5;background:var(--bg);
    padding:16px 16px 10px;border-bottom:1px solid var(--line)}
  .brand{font-size:12px;letter-spacing:1px;color:var(--muted)}
  h1{margin:2px 0 12px;font-size:26px;color:var(--accent)}
  .hello{font-size:13px;color:var(--muted);margin:-8px 0 10px}
  .search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;
    background:var(--card);border:1px solid var(--line);border-radius:12px}
  .search input{border:0;outline:0;flex:1;font:inherit;font-size:15px;background:transparent;color:var(--ink)}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 2px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid #D9C9A8;
    background:var(--card);color:var(--ink);font-size:14px}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
  .promo{border-radius:16px;background:var(--ink);color:var(--bg);padding:16px;
    display:flex;gap:12px;align-items:center;border:0;text-align:left;width:100%}
  .promo small{color:var(--gold);letter-spacing:1px;font-size:11px}
  .promo strong{display:block;font-size:17px;margin:4px 0}
  .promo span.sub{font-size:13px;color:#E9DFCB}
  .promo .go{flex:none;height:40px;padding:0 16px;border-radius:20px;background:var(--gold);
    color:var(--ink);font-weight:600;display:flex;align-items:center}
  h2{margin:4px 0 0;font-size:17px}

  .card{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--card);
    border:1px solid #EFE5D2;text-align:left;width:100%;color:inherit;font:inherit}
  .card:active{transform:scale(.99)}
  .thumb{width:84px;height:84px;flex:none;border-radius:10px;background:var(--thumb);
    object-fit:cover;display:flex;align-items:center;justify-content:center}
  .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .title{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .title strong{font-size:15px}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#F6E3E3;color:var(--accent);font-weight:600}
  .desc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .prices{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
  .prices span{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--chip)}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}

  /* bottom sheet */
  .overlay{position:fixed;inset:0;background:rgba(43,29,20,.45);display:none;z-index:20}
  .overlay.open{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);
    border-radius:20px 20px 0 0;max-height:90vh;display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .25s ease;max-width:640px;margin:0 auto}
  .sheet.open{transform:none}
  .sheet .hero{height:180px;background:var(--thumb);border-radius:20px 20px 0 0;position:relative;flex:none;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sheet .hero img{width:100%;height:100%;object-fit:cover}
  .close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:22px;border:0;
    background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center}
  .sheet .body{overflow-y:auto;padding:18px 16px 16px;display:flex;flex-direction:column;gap:16px}
  .sheet h3{margin:0;font-size:22px}
  .sheet p{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
  fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  legend{font-weight:600;font-size:15px;margin-bottom:8px;padding:0}
  .opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:12px;
    background:var(--card);border:1px solid var(--line);font-size:15px}
  .opt:has(input:checked){border:2px solid var(--accent)}
  .opt input{accent-color:var(--accent);width:18px;height:18px;margin:0}
  .opt span{flex:1}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{height:40px;padding:0 14px;border-radius:20px;border:1px solid #D9C9A8;background:var(--card);color:var(--ink);font-size:14px}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .pts{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:13px}
  .sheet footer{flex:none;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:#fff;
    border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .sheet footer .sum{flex:1;display:flex;flex-direction:column}
  .sheet footer .sum small{font-size:12px;color:var(--muted)}
  .sheet footer .sum strong{font-size:18px}
  .cta{height:48px;padding:0 22px;border-radius:24px;border:0;background:var(--accent);color:#fff;font-size:15px;font-weight:600}
  .cta:disabled{opacity:.6}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:90vw;text-align:center}
  .toast.show{display:block}
  .skeleton{height:110px;border-radius:14px;background:linear-gradient(90deg,#F1E8D6,#F8F2E6,#F1E8D6);
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>

<header>
  <div class="brand">ZEN SAI MASSAGE</div>
  <h1 class="serif">เมนู &amp; บริการ</h1>
  <div class="hello" id="hello" hidden></div>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5B4E" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span class="sr">ค้นหาบริการ</span>
    <input id="q" type="search" placeholder="ค้นหา เช่น นวดเท้า, ออฟฟิศซินโดรม" autocomplete="off">
  </label>
  <nav class="tabs" id="tabs" role="tablist" aria-label="หมวดบริการ"></nav>
</header>

<main id="list" aria-live="polite">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</main>

<div class="overlay" id="overlay"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle" hidden>
  <div class="hero" id="sHero">
    <div id="sMedia" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"></div>
    <button class="close" id="sClose" aria-label="ปิด">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="body">
    <div>
      <h3 class="serif" id="sTitle"></h3>
      <p id="sDesc"></p>
    </div>
    <fieldset id="sDur"><legend>เลือกระยะเวลา</legend></fieldset>
    <fieldset id="sOptWrap" hidden><legend id="sOptTitle">ตัวเลือก</legend><div class="chips" id="sOpt"></div></fieldset>
    <div class="pts">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A6A2E" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>
      <span>รับ <strong id="sPts">0</strong> แต้ม หลังใช้บริการ</span>
    </div>
  </div>
  <footer>
    <div class="sum"><small id="sSumLabel"></small><strong id="sSumPrice"></strong></div>
    <button class="cta" id="sBook">จองคิว</button>
  </footer>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
/* ================== ตั้งค่า ================== */
const CONFIG = {
  LIFF_ID: '2012242488-9FyrgqQd',      // จาก LINE Developers > LIFF
  SHEET_CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT_Zn71o_I7FgMjcHRCRzixSEFGeyavFXZJ57lqwxLIShnKe5nII9MDj4HGU1UefXMEYSWHhbrmtxed/pubhtml?gid=1917944634&single=true',            // Google Sheet > File > Share > Publish to web > CSV  (ว่าง = ใช้ข้อมูลตัวอย่าง)
  BOOKING_URL: 'https://liff.line.me/2012242488-9FyrgqQd/',  // หน้าจองคิว (ว่าง = ส่งข้อความจองเข้าแชตแทน)
  POINTS_PER_100_BAHT: 10,      // อัตราแต้ม: ทุก 100 บาท ได้กี่แต้ม
};

/* ข้อมูลตัวอย่าง: 1 แถว = 1 บริการ x 1 ระยะเวลา (ราคาเป็นตัวอย่าง แก้ใน Sheet) */
const SAMPLE_CSV = `service_id,category,name,description,duration_min,price,image_url,badge,options_title,options,active,sort
combo1,แพ็กเกจ,คอมโบ เท้า 30 + ไทย 60,คลายเท้าก่อน แล้วต่อด้วยนวดไทยทั้งตัว,90,0,,โปร,,,TRUE,1
thai,นวดไทย,นวดแผนไทย,คลายกล้ามเนื้อทั้งตัว ยืดเส้น กดจุด,60,0,,ขายดี,,,TRUE,2
thai,นวดไทย,นวดแผนไทย,,90,0,,,,,TRUE,2
thai,นวดไทย,นวดแผนไทย,,120,0,,,,,TRUE,2
oil,น้ำมัน/อโรมา,นวดน้ำมันอโรมา,นวดด้วยน้ำมันหอมระเหย ผ่อนคลาย หลับสบาย,60,0,,,กลิ่นน้ำมัน,ลาเวนเดอร์|ตะไคร้|มะลิ|ไม่มีกลิ่น,TRUE,3
oil,น้ำมัน/อโรมา,นวดน้ำมันอโรมา,,90,0,,,,,TRUE,3
foot,นวดเท้า,นวดเท้า,กดจุดฝ่าเท้า ลดอาการเมื่อยล้า,30,0,,,,,TRUE,4
foot,นวดเท้า,นวดเท้า,,60,0,,,,,TRUE,4
office,คอ บ่า ไหล่,นวดคอ บ่า ไหล่ (ออฟฟิศซินโดรม),เน้นจุดตึงจากการนั่งทำงานนาน,30,0,,,,,TRUE,5
office,คอ บ่า ไหล่,นวดคอ บ่า ไหล่ (ออฟฟิศซินโดรม),,60,0,,,,,TRUE,5
stone,ประคบ/หินร้อน,ประคบสมุนไพร / Hot Stone,ความร้อนช่วยคลายจุดตึงลึก,90,0,,,,,TRUE,6`;

/* ================== state ================== */
let SERVICES = [];   // [{id,category,name,desc,image,badge,optTitle,options[],sort,durations:[{min,price}]}]
let currentCat = 'ทั้งหมด';
let current = null, chosenDur = null, chosenOpt = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht = n => n > 0 ? '฿' + Number(n).toLocaleString('th-TH') : '฿—';
const points = price => Math.floor(price / 100) * CONFIG.POINTS_PER_100_BAHT;
const LOTUS = '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#8A6A2E" stroke-width="1.5" aria-hidden="true"><path d="M12 20c-4 0-8-3-9-7 3 0 6 1 9 4 3-3 6-4 9-4-1 4-5 7-9 7z"/><path d="M12 17c-2-2-3-5-3-8 1.5 1 2.5 2 3 3 .5-1 1.5-2 3-3 0 3-1 6-3 8z"/></svg>';

/* ================== CSV ================== */
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row); }
  const head = rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(v=>v.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}

function buildServices(rows){
  const map = new Map();
  for(const r of rows){
    if(String(r.active).toUpperCase()==='FALSE') continue;
    const id = r.service_id || r.name;
    if(!map.has(id)) map.set(id,{id,category:'',name:'',desc:'',image:'',badge:'',optTitle:'',options:[],sort:999,durations:[]});
    const s = map.get(id);
    s.category ||= r.category; s.name ||= r.name; s.desc ||= r.description;
    s.image ||= r.image_url; s.badge ||= r.badge; s.optTitle ||= r.options_title;
    if(!s.options.length && r.options) s.options = r.options.split('|').map(x=>x.trim()).filter(Boolean);
    if(r.sort) s.sort = Math.min(s.sort, Number(r.sort)||999);
    const min = Number(r.duration_min), price = Number(String(r.price).replace(/[^\d.]/g,''))||0;
    if(min) s.durations.push({min, price});
  }
  return [...map.values()].map(s=>(s.durations.sort((a,b)=>a.min-b.min), s)).sort((a,b)=>a.sort-b.sort);
}

async function loadData(){
  let text = SAMPLE_CSV;
  if(CONFIG.SHEET_CSV_URL){
    try{
      const res = await fetch(CONFIG.SHEET_CSV_URL + (CONFIG.SHEET_CSV_URL.includes('?')?'&':'?') + 't=' + Date.now());
      if(!res.ok) throw new Error(res.status);
      text = await res.text();
    }catch(e){ toast('โหลดเมนูล่าสุดไม่สำเร็จ แสดงข้อมูลสำรอง'); }
  }
  SERVICES = buildServices(parseCSV(text));
}

/* ================== render ================== */
function renderTabs(){
  const cats = ['ทั้งหมด', ...new Set(SERVICES.map(s=>s.category).filter(Boolean))];
  $('tabs').innerHTML = cats.map(c=>`<button class="tab" role="tab" aria-selected="${c===currentCat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}

function priceChips(s){ return s.durations.map(d=>`<span>${d.min} น. · ${baht(d.price)}</span>`).join(''); }
function thumb(s){ return s.image ? `<img class="thumb" src="${esc(s.image)}" alt="" loading="lazy">` : `<div class="thumb">${LOTUS}</div>`; }

function renderList(){
  const q = $('q').value.trim().toLowerCase();
  const items = SERVICES.filter(s =>
    (currentCat==='ทั้งหมด' || s.category===currentCat) &&
    (!q || (s.name+' '+s.desc+' '+s.category).toLowerCase().includes(q)));
  const promo = (currentCat==='ทั้งหมด' && !q) ? SERVICES.find(s=>s.badge==='โปร') : null;
  let html = '';
  if(promo){
    const d = promo.durations[0] || {min:0,price:0};
    html += `<button class="promo" data-id="${esc(promo.id)}">
      <div style="flex:1"><small>โปรโมชั่น</small><strong class="serif">${esc(promo.name)}</strong>
      <span class="sub">${d.min} นาที · ${baht(d.price)} · ได้ ${points(d.price)} แต้ม</span></div>
      <span class="go">ดูเลย</span></button>`;
  }
  const rest = items.filter(s=>s!==promo);
  if(rest.length) html += `<h2 class="serif">${currentCat==='ทั้งหมด'?'บริการทั้งหมด':esc(currentCat)}</h2>`;
  html += rest.map(s=>`<button class="card" data-id="${esc(s.id)}">
      ${thumb(s)}
      <div class="info">
        <div class="title"><strong>${esc(s.name)}</strong>${s.badge?`<span class="badge">${esc(s.badge)}</span>`:''}</div>
        ${s.desc?`<span class="desc">${esc(s.desc)}</span>`:''}
        <div class="prices">${priceChips(s)}</div>
      </div></button>`).join('');
  if(!items.length && !promo) html = `<div class="empty">ไม่พบบริการที่ค้นหา</div>`;
  $('list').innerHTML = html;
}

/* ================== detail sheet ================== */
function openSheet(id){
  current = SERVICES.find(s=>s.id===id); if(!current) return;
  chosenDur = current.durations[0] || null;
  chosenOpt = current.options[0] || null;
  $('sTitle').textContent = current.name;
  $('sDesc').textContent = current.desc || '';
  $('sMedia').innerHTML = current.image ? `<img src="${esc(current.image)}" alt="">` : LOTUS;
  $('sDur').innerHTML = '<legend>เลือกระยะเวลา</legend>' + current.durations.map((d,i)=>`
    <label class="opt"><input type="radio" name="dur" value="${i}" ${i===0?'checked':''}>
    <span>${d.min} นาที</span><strong>${baht(d.price)}</strong></label>`).join('');
  $('sOptWrap').hidden = !current.options.length;
  $('sOptTitle').textContent = current.optTitle || 'ตัวเลือก';
  $('sOpt').innerHTML = current.options.map((o,i)=>`<button type="button" class="chip" aria-pressed="${i===0}" data-opt="${esc(o)}">${esc(o)}</button>`).join('');
  updateSummary();
  const sheet = $('sheet');
  sheet.hidden = false; $('overlay').classList.add('open');
  requestAnimationFrame(()=>sheet.classList.add('open'));
  $('sClose').focus();
  document.body.style.overflow='hidden';
}
function closeSheet(){
  const sheet = $('sheet');
  sheet.classList.remove('open'); $('overlay').classList.remove('open');
  document.body.style.overflow='';
  setTimeout(()=>{ sheet.hidden = true; }, 250);
}
function updateSummary(){
  if(!chosenDur) return;
  $('sSumLabel').textContent = `${chosenDur.min} นาที` + (chosenOpt ? ` · ${chosenOpt}` : '');
  $('sSumPrice').textContent = baht(chosenDur.price);
  $('sPts').textContent = points(chosenDur.price);
}

/* ================== จองคิว ================== */
async function book(){
  if(!current || !chosenDur) return;
  const p = new URLSearchParams({service: current.id, dur: chosenDur.min});
  if(chosenOpt) p.set('opt', chosenOpt);
  if(CONFIG.BOOKING_URL){
    location.href = CONFIG.BOOKING_URL + (CONFIG.BOOKING_URL.includes('?')?'&':'?') + p;
    return;
  }
  const text = `ขอจองคิว: ${current.name} ${chosenDur.min} นาที` + (chosenOpt?` (${chosenOpt})`:'') + ` · ${baht(chosenDur.price)}`;
  if(window.liff && liffReady && liff.isInClient()){
    const btn = $('sBook'); btn.disabled = true;
    try{
      await liff.sendMessages([{type:'text', text}]);
      liff.closeWindow();
    }catch(e){ toast('ส่งข้อความไม่สำเร็จ กรุณาลองใหม่'); btn.disabled = false; }
  }else{
    toast('(โหมดทดสอบ) จะส่งข้อความ: ' + text);
  }
}

/* ================== misc ================== */
let toastTimer;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3000); }

$('tabs').addEventListener('click', e=>{ const b=e.target.closest('.tab'); if(!b) return; currentCat=b.dataset.cat; renderTabs(); renderList(); });
$('q').addEventListener('input', renderList);
$('list').addEventListener('click', e=>{ const b=e.target.closest('[data-id]'); if(b) openSheet(b.dataset.id); });
$('sDur').addEventListener('change', e=>{ chosenDur = current.durations[Number(e.target.value)]; updateSummary(); });
$('sOpt').addEventListener('click', e=>{ const b=e.target.closest('.chip'); if(!b) return;
  chosenOpt=b.dataset.opt; $('sOpt').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', c===b)); updateSummary(); });
$('sClose').addEventListener('click', closeSheet);
$('overlay').addEventListener('click', closeSheet);
$('sheet').addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
$('sBook').addEventListener('click', book);

let liffReady = false;
async function initLiff(){
  if(!window.liff || !CONFIG.LIFF_ID || CONFIG.LIFF_ID==='YOUR_LIFF_ID') return;
  try{
    await liff.init({ liffId: CONFIG.LIFF_ID });
    liffReady = true;
    if(liff.isLoggedIn()){
      const prof = await liff.getProfile();
      const h=$('hello'); h.textContent = `สวัสดีค่ะ คุณ${prof.displayName}`; h.hidden=false;
    }
  }catch(e){ console.warn('LIFF init failed', e); }
}

(async function start(){
  await Promise.all([initLiff(), loadData()]);
  const qs = new URLSearchParams(location.search);
  if(qs.get('cat')) currentCat = qs.get('cat');      // เปิดตรงหมวด: ?cat=นวดเท้า
  renderTabs(); renderList();
  if(qs.get('service')) openSheet(qs.get('service')); // เปิดตรงบริการ: ?service=oil
})();
</script>
