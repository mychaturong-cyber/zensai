<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองคิวนวด - ZenSai Massage</title>
  <!-- Tailwind CSS สำหรับจัดสไตล์ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 min-h-screen">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 border border-gray-100">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-green-700">ZenSai Massage</h1>
      <p class="text-xs text-gray-500 mt-1">จองคิวนวดออนไลน์</p>
      <!-- แถบแสดงสถานะการเชื่อมต่อ LINE -->
      <div id="lineStatus" class="mt-2 text-xs text-gray-600 bg-gray-100 py-1 px-3 rounded-full inline-block">เตรียมระบบ...</div>
    </div>

    <form id="bookingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
      <!-- เลือกบริการ -->
      <div>
        <label class="block text-sm font-medium mb-1">รายการบริการ</label>
        <select id="service" class="w-full border rounded-xl p-3 bg-gray-50 text-sm focus:ring-2 focus:ring-green-500 outline-none" required>
          <option value="นวดไทย">นวดไทย</option>
          <option value="นวดเท้า">นวดเท้า</option>
          <option value="นวดออยล์">นวดออยล์</option>
          <option value="นวดไทยออยล์">นวดไทยออยล์</option>
        </select>
      </div>

      <!-- เลือกพนักงานนวด -->
      <div>
        <label class="block text-sm font-medium mb-1">พนักงานนวด (หมอ)</label>
        <select id="doctor" class="w-full border rounded-xl p-3 bg-gray-50 text-sm focus:ring-2 focus:ring-green-500 outline-none" required>
          <option value="พี่สุ">พี่สุ</option>
          <option value="พี่นุ่น">พี่นุ่น</option>
        </select>
      </div>

      <!-- เลือกจำนวนชั่วโมง -->
      <div>
        <label class="block text-sm font-medium mb-1">ระยะเวลา (ชั่วโมง)</label>
        <select id="duration" class="w-full border rounded-xl p-3 bg-gray-50 text-sm focus:ring-2 focus:ring-green-500 outline-none" required>
          <option value="1">1 ชั่วโมง</option>
          <option value="1.5">1.5 ชั่วโมง</option>
          <option value="2">2 ชั่วโมง</option>
          <option value="3">3 ชั่วโมง</option>
        </select>
      </div>

      <!-- วันที่และเวลา -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium mb-1">วันที่</label>
          <input type="date" id="date" class="w-full border rounded-xl p-3 bg-gray-50 text-sm focus:ring-2 focus:ring-green-500 outline-none" required>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">เวลาเริ่มต้น</label>
          <input type="time" id="startTime" class="w-full border rounded-xl p-3 bg-gray-50 text-sm focus:ring-2 focus:ring-green-500 outline-none" required>
        </div>
      </div>

      <!-- ข้อมูลลูกค้า -->
      <div>
        <label class="block text-sm font-medium mb-1">ชื่อ และ เบอร์โทรติดต่อ</label>
        <input type="text" id="customerInfo" placeholder="เช่น คุณกบ 081-234-5678" class="w-full border rounded-xl p-3 bg-gray-50 text-sm focus:ring-2 focus:ring-green-500 outline-none" required>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-green-700 hover:bg-green-800 text-white font-medium py-3 rounded-xl shadow-md transition duration-200 mt-6">
        ยืนยันการจองคิว
      </button>
    </form>
  </div>

  <!-- Custom Success Modal -->
  <div id="successModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 text-center max-w-sm w-full shadow-2xl transform transition-all">
      <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h3 class="text-xl font-bold text-gray-800 mb-2">จองคิวสำเร็จ!</h3>
      <p class="text-gray-500 text-sm mb-1">รหัสการจองของคุณคือ</p>
      <div id="modalBookingId" class="text-2xl font-extrabold text-green-700 bg-green-50 py-2 px-4 rounded-xl mb-6 tracking-wide">
        BK-XXXXXX
      </div>
      <button onclick="closeModalAndExit()" class="w-full bg-green-700 hover:bg-green-800 text-white font-medium py-3 rounded-xl transition">
        ตกลง
      </button>
    </div>
  </div>

  <script>
    let userLineId = "";
    const LIFF_ID = "2012242488-OK0d3lhO";
    const GAS_URL = "https://script.google.com/macros/s/XXXXXXXX/exec";
    const statusElem = document.getElementById('lineStatus');

    // ฟังก์ชันเริ่มระบบทำงานทันที ไม่ต้องรอหน้าเว็บโหลดเสร็จทั้งหมด
    async function initApp() {
      // 1. ตั้งวันที่
      const dateInput = document.getElementById('date');
      if (dateInput) {
        dateInput.value = new Date().toISOString().split('T')[0];
      }

      if (statusElem) statusElem.innerText = "1. กำลังเชื่อมต่อ LIFF...";

      if (typeof liff === 'undefined') {
        if (statusElem) {
          statusElem.innerText = "ไม่พบระบบ LINE";
          statusElem.className = "mt-2 text-xs text-red-600 bg-red-50 py-1 px-3 rounded-full inline-block";
        }
        return;
      }

      try {
        // 2. เรียกใช้งาน LIFF
        await Promise.race([
    liff.init({ liffId: LIFF_ID, withLoginOnExternalBrowser: true }),
    new Promise((_, rej) => setTimeout(() => rej(new Error("LIFF init timeout")), 10000))
  ]);
        
        if (statusElem) statusElem.innerText = "2. กำลังตรวจสอบสิทธิ์...";

        if (liff.isLoggedIn()) {
          if (statusElem) statusElem.innerText = "3. กำลังดึงโปรไฟล์...";
          const profile = await liff.getProfile();
          if (profile && profile.userId) {
            userLineId = profile.userId;
            if (statusElem) {
              statusElem.innerText = "✓ เชื่อมต่อ: " + profile.displayName;
              statusElem.className = "mt-2 text-xs font-semibold text-green-600 bg-green-50 py-1 px-3 rounded-full inline-block";
            }
          }
        } else {
          if (liff.isInClient()) {
            liff.login();
          } else {
            if (statusElem) {
              statusElem.innerText = "โหมดเว็บทั่วไป (ไม่มี LINE ID)";
              statusElem.className = "mt-2 text-xs text-amber-600 bg-amber-50 py-1 px-3 rounded-full inline-block";
            }
          }
        }
      } catch (err) {
        console.error("LIFF Error:", err);
        if (statusElem) {
          statusElem.innerText = "Error: " + (err.message || err.toString());
          statusElem.className = "mt-2 text-xs text-red-600 bg-red-50 py-1 px-3 rounded-full inline-block";
        }
      }
    }

    // เรียกฟังก์ชันสตาร์ทระบบทันที!
    initApp();

    async function handleFormSubmit(e) {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "กำลังบันทึกการจอง...";

      if (!userLineId && typeof liff !== 'undefined' && liff.isLoggedIn()) {
        try {
          const profile = await liff.getProfile();
          if (profile && profile.userId) {
            userLineId = profile.userId;
          }
        } catch (err) {}
      }

      const dateVal = document.getElementById('date').value;
      const startVal = document.getElementById('startTime').value;
      const durationVal = parseFloat(document.getElementById('duration').value);

      const [h, m] = startVal.split(':').map(Number);
      const addedMinutes = Math.round((durationVal % 1) * 60);
      const totalMinutes = m + addedMinutes;
      const endHour = h + Math.floor(durationVal) + Math.floor(totalMinutes / 60);
      const endMin = totalMinutes % 60;
      const endTimeVal = String(endHour).padStart(2, '0') + ':' + String(endMin).padStart(2, '0');

      const payload = {
        service: document.getElementById('service').value,
        doctor: document.getElementById('doctor').value,
        duration: durationVal,
        date: dateVal,
        startTime: startVal,
        endTime: endTimeVal,
        customerInfo: document.getElementById('customerInfo').value,
        lineUserId: userLineId
      };

      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            document.getElementById('modalBookingId').innerText = res.bookingId;
            document.getElementById('successModal').classList.remove('hidden');
          } else {
            alert("เกิดข้อผิดพลาด: " + res.error);
            btn.disabled = false;
            btn.innerText = "ยืนยันการจองคิว";
          }
        })
        .withFailureHandler(err => {
          alert("ระบบขัดข้อง: " + err.message);
          btn.disabled = false;
          btn.innerText = "ยืนยันการจองคิว";
        })
        .saveBookingFromLiff(payload);
    }

    function closeModalAndExit() {
      const modal = document.getElementById('successModal');
      if (modal) modal.classList.add('hidden');
      const form = document.getElementById('bookingForm');
      if (form) form.reset();
      const dateInput = document.getElementById('date');
      if (dateInput) dateInput.value = new Date().toISOString().split('T')[0];
      const btn = document.getElementById('submitBtn');
      if (btn) {
        btn.disabled = false;
        btn.innerText = "ยืนยันการจองคิว";
      }
      try {
        if (typeof liff !== 'undefined' && liff.isInClient()) liff.closeWindow();
      } catch (e) {}
      try { window.close(); } catch (e) {}
    }
  </script>
</body>
</html>
