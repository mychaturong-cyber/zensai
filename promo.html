<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โปรโมชั่น · เส้นสาย Zensai Massage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  header.top{background:var(--c-bg)}
  main{padding-top:var(--sp-4);padding-bottom:var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-4)}
  h1.pg{font-size:var(--fs-xl);display:flex;align-items:center;gap:var(--sp-2)}
  h1.pg .lbl{font-size:var(--fs-xs);font-weight:600;border:1px solid var(--c-gold);color:var(--c-primary);border-radius:var(--r-pill);padding:0 10px}
  .lead{color:var(--c-text-2);font-size:var(--fs-sm);margin-top:-8px}

  .pcard{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column}
  .pcard .img{aspect-ratio:16/9;background:var(--c-muted-bg)}
  .pcard .img img{width:100%;height:100%;object-fit:cover;display:block}
  .pcard .band{background:var(--c-primary);color:#fff;padding:var(--sp-4);display:flex;flex-direction:column;gap:4px}
  .pcard .band .tag{align-self:flex-start;font-size:var(--fs-xs);border:1px solid var(--c-gold);border-radius:var(--r-pill);padding:0 10px}
  .pcard .band strong{font-size:var(--fs-lg);line-height:1.35}
  .pcard .body{padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3)}
  .pcard .desc{color:var(--c-text-2);font-size:var(--fs-sm);white-space:pre-line}
  .price{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap}
  .price b{font-size:var(--fs-xl);color:var(--c-primary)}
  .price s{color:var(--c-text-2);font-size:var(--fs-sm)}
  .price .save{font-size:var(--fs-xs);font-weight:600;color:#7A4B00;background:#FFF1D6;border-radius:var(--r-pill);padding:2px 10px}
  .until{font-size:var(--fs-xs);color:var(--c-text-2);display:flex;align-items:center;gap:6px}
  .pcard .btn{width:100%;min-height:52px;font-size:var(--fs-md)}

  .empty{background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);padding:var(--sp-6) var(--sp-4);text-align:center;display:flex;flex-direction:column;gap:var(--sp-3);align-items:center}
  .empty p{color:var(--c-text-2)}
  .links{display:flex;gap:var(--sp-2);flex-wrap:wrap;justify-content:center}
  .mcard .perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--sp-2)}
  .mcard .perks li{display:flex;gap:var(--sp-2);align-items:flex-start;font-size:var(--fs-sm)}
  .mcard .perks li::before{content:"✓";color:var(--c-gold);font-weight:700}
  .mcard .note{font-size:var(--fs-xs);color:var(--c-text-2)}
  .close-bn{display:flex;gap:12px;align-items:flex-start;background:var(--c-danger-bg);color:var(--c-danger);border-radius:var(--r-lg);padding:12px 16px;margin:12px auto 0;font-size:var(--fs-sm)}
  .close-bn strong{display:block;font-size:var(--fs-md)}
  .close-bn ul{margin:4px 0 0;padding-left:18px}
</style>
</head>
<body>
<header class="top">
  <div class="brandbar">
    <div class="container">
      <img class="brand-logo" src="logo.png" alt="โลโก้เส้นสาย" onerror="this.remove()">
      <div class="brand-text"><span class="brand-th">เส้นสาย</span><span class="brand-en">Zensai Massage · นวดเพื่อสุขภาพ</span></div>
    </div>
    <div class="brand-line"></div>
  </div>
</header>
<div class="container" id="closeWrap" hidden><div class="close-bn" role="status"><div id="closeBanner"></div></div></div>

<main class="container" id="list" aria-live="polite">
  <h1 class="pg">โปรโมชั่น <span class="lbl">ประจำเดือน</span></h1>
  <p class="lead">ราคาพิเศษสำหรับลูกค้าเส้นสาย กดจองได้ทันที</p>
  <div class="skeleton" style="height:220px"></div><div class="skeleton" style="height:220px"></div>
</main>

<footer class="site-footer container" aria-label="ข้อมูลร้าน" style="margin-top:0">
  <div class="row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><a data-shop="phone" href="tel:0838974088">083-897-4088</a></div>
  <div class="row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-4.9A8.5 8.5 0 1 1 21 11.5z"/></svg><a data-shop="line" href="https://lin.ee/VCzZf3y">แชต LINE ร้าน</a></div>
</footer>

<script>
/* แถบแจ้งร้านปิด (แท็บ วันปิดร้าน): แสดงระหว่างปิด และล่วงหน้าตาม closureNoticeDays ในแท็บ ตั้งค่า */
function renderClosureBanner(list, noticeDays){
  const wrap = document.getElementById('closeWrap'); if (!wrap) return;
  const p2 = n => String(n).padStart(2, '0'), now = new Date();
  const today = now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate());
  const days = Number.isFinite(Number(noticeDays)) && noticeDays !== '' && noticeDays !== undefined ? Number(noticeDays) : 7;
  const toD = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
  const until = iso => Math.round((toD(iso) - toD(today)) / 86400000);
  const fmt = iso => new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short' }).format(toD(iso));
  const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const show = (Array.isArray(list) ? list : []).filter(c => c && c.start && c.end >= today && until(c.start) <= days);
  if (!show.length){ wrap.hidden = true; return; }
  const nowClosed = show.some(c => c.start <= today);
  const nDays = c => Math.round((toD(c.end) - toD(c.start)) / 86400000) + 1;
  const head = nowClosed ? 'วันนี้ร้านหยุด' : show.length === 1 ? `ร้านหยุด ${nDays(show[0])} วัน` : 'แจ้งวันหยุดร้าน';
  document.getElementById('closeBanner').innerHTML = `<strong>${head}</strong><ul>${show.map(c =>
    `<li>${c.start === c.end ? fmt(c.start) : fmt(c.start) + ' – ' + fmt(c.end)}${c.message ? ' · ' + e(c.message) : ''}</li>`).join('')}</ul>`;
  wrap.hidden = false;
}
</script>
<script>
/* ================== ตั้งค่า ==================
   โปรโมชั่นแก้ได้ที่แท็บ "โปรโมชั่น" ในชีต (ติ๊กช่อง เปิดใช้) — ไม่ต้องแก้ไฟล์นี้ */
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzGYGDZ9U1p-C6fhe0xOBfk2Kd2uC1qpuZTYIqtyW0Fg2zHU_-hNtagqy3VfTC_7IYmIg/exec',
  BOOKING_URL: 'https://liff.line.me/2012242488-OK0d3lhO/',
  MENU_URL: 'https://liff.line.me/2012242488-9FyrgqQd',
  POINTS_URL: 'https://liff.line.me/2012242488-MQcweAjg',   // หน้าบัตรสะสมแต้ม
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht = n => '฿' + Number(n).toLocaleString('th-TH');
const thDate = iso => { const [y,m,d] = String(iso).split('-').map(Number); if(!y) return '';
  const mm = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][m-1]; return `${d} ${mm} ${y+543}`; };
const CACHE_KEY = 'zensai_promos_v2';

function bookUrl(p){
  const q = new URLSearchParams({ svc_name: p.service });
  if (p.minutes) q.set('dur', p.minutes);
  if (p.id) q.set('promo', p.id);   // ราคาโปรคิดจากชีตฝั่งเซิร์ฟเวอร์ ไม่ส่งราคาไปในลิงก์
  return CONFIG.BOOKING_URL + '?' + q;
}

// การ์ดสมาชิกสะสมแต้ม (ตัวเลขจากแท็บ "ตั้งค่า")
function memberCard(s){
  const rate = Number(s.pointsPer100) || 0, goal = Number(s.rewardPoints) || 0, label = s.rewardLabel || '';
  if (!rate) return '';
  return `<article class="pcard mcard">
    <div class="band"><span class="tag">สมาชิก</span><strong>สะสมแต้มกับเส้นสาย</strong></div>
    <div class="body">
      <ul class="perks">
        <li>ทุก 100 บาท รับ ${rate} แต้ม</li>
        ${goal > 0 && label ? `<li>ครบ ${goal.toLocaleString('th-TH')} แต้ม แลก${esc(label)}</li>` : ''}
        <li>ผูกเบอร์โทรครั้งเดียว สะสมได้ทั้งจองผ่าน LINE และมาที่ร้าน</li>
      </ul>
      <p class="note">* รายการโปรโมชั่นและบริการฟรีไม่ได้รับแต้ม ดูเงื่อนไขทั้งหมดในหน้าบัตรสะสมแต้ม</p>
      <a class="btn btn-primary" href="${CONFIG.POINTS_URL}">สมัครสมาชิก / ดูแต้มของฉัน</a>
    </div></article>`;
}

function render(data){
  const s = data.settings || {};
  renderClosureBanner(data.closures, s.closureNoticeDays);
  if (s.phone) document.querySelectorAll('[data-shop="phone"]').forEach(el => { el.textContent = s.phone; el.href = 'tel:' + String(s.phone).replace(/\D/g, ''); });
  if (s.lineUrl) document.querySelectorAll('[data-shop="line"]').forEach(el => el.href = s.lineUrl);
  const head = `<h1 class="pg">โปรโมชั่น <span class="lbl">ประจำเดือน</span></h1>`;
  const promos = data.promos || [];
  if (!promos.length){
    $('list').innerHTML = head + `<div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" style="color:var(--c-gold)"><path d="M20 12v8H4v-8M2 7h20v5H2zM12 20V7M12 7H8a2 2 0 1 1 0-4c2 0 4 4 4 4zm0 0h4a2 2 0 1 0 0-4c-2 0-4 4-4 4z"/></svg>
      <strong>ยังไม่มีโปรโมชั่นในขณะนี้</strong>
      <p>ติดตามโปรใหม่ได้ทาง LINE ของร้าน หรือดูเมนูและราคาปกติได้เลย</p>
      <div class="links"><a class="btn btn-primary" href="${CONFIG.MENU_URL}">ดูเมนูทั้งหมด</a><a class="btn btn-secondary" href="${CONFIG.BOOKING_URL}">จองคิว</a></div></div>` + memberCard(s);
    return;
  }
  $('list').innerHTML = head + `<p class="lead">ราคาพิเศษสำหรับลูกค้าเส้นสาย กดจองได้ทันที</p>` + promos.map(p => {
    const save = (p.normal > p.price && p.price) ? `<span class="save">ประหยัด ${baht(p.normal - p.price)}</span>` : '';
    return `<article class="pcard">
      ${p.image ? `<div class="img"><img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy" onerror="this.parentNode.remove()"></div>` : ''}
      <div class="band"><span class="tag">โปรโมชั่น</span><strong>${esc(p.title)}</strong></div>
      <div class="body">
        ${p.desc ? `<p class="desc">${esc(p.desc)}</p>` : ''}
        ${p.price ? `<div class="price"><b>${baht(p.price)}</b>${p.normal > p.price ? `<s>${baht(p.normal)}</s>` : ''}${save}</div>` : ''}
        ${(p.days && p.days.length) || (p.from && p.to) ? `<div class="until"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>${esc([p.days && p.days.length ? 'เฉพาะวัน' + p.daysText : '', p.from && p.to ? 'เริ่มนวด ' + p.from + '-' + p.to + ' น.' : ''].filter(Boolean).join(' · '))}</div>` : ''}
        ${p.end ? `<div class="until"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>ถึงวันที่ ${thDate(p.end)}</div>` : ''}
        <a class="btn btn-primary" href="${p.service ? esc(bookUrl(p)) : CONFIG.BOOKING_URL}">จองโปรนี้</a>
      </div></article>`;
  }).join('') + memberCard(s);
}

async function load(){
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e){}
  if (cached) render(cached);
  try{
    const r = await fetch(CONFIG.GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'promos' }) });
    const data = await r.json();
    if (!data.success) throw new Error(data.error || 'load failed');
    render(data);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e){}
  }catch(e){
    if (!cached) $('list').innerHTML = `<div class="empty"><strong>โหลดโปรโมชั่นไม่สำเร็จ</strong><p>กรุณาลองใหม่อีกครั้ง หรือติดต่อร้านทาง LINE</p>
      <div class="links"><button class="btn btn-primary" onclick="location.reload()">ลองใหม่</button></div></div>`;
  }
}
load();
</script>
</body>
</html>
