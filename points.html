<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บัตรสะสมแต้ม · เส้นสาย Zensai Massage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  main{display:flex;flex-direction:column;gap:var(--sp-4);padding-bottom:var(--sp-6)}
  .member{border-radius:var(--r-lg);background:var(--c-primary);color:#fff;padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3);
    border:1px solid var(--c-primary);position:relative;overflow:hidden}
  .member::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--c-gold)}
  .member .who{font-size:var(--fs-sm);opacity:.9}
  .member .bal{display:flex;align-items:baseline;gap:var(--sp-2)}
  .member .bal strong{font-size:48px;line-height:1}
  .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--c-gold);border-radius:5px;width:0;transition:width .6s}
  .goal{font-size:var(--fs-sm)}
  .rule{font-size:var(--fs-sm);color:var(--c-text-2);background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4)}
  h2{font-size:var(--fs-lg)}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4)}
  li+li{border-top:1px solid var(--c-line)}
  li .t{flex:1;min-width:0;display:flex;flex-direction:column}
  li .t small{color:var(--c-text-2);font-size:var(--fs-xs)}
  li .p{font-weight:700;white-space:nowrap}
  li .p.plus{color:var(--c-success)} li .p.minus{color:var(--c-danger)}
  .empty{justify-content:center;color:var(--c-text-2);font-size:var(--fs-sm);padding:var(--sp-6) var(--sp-4)}
</style>
</head>
<body>
<header class="brandbar">
  <div class="container">
    <img class="brand-logo" src="logo.png" alt="โลโก้เส้นสาย" onerror="this.remove()">
    <div class="brand-text"><span class="brand-th">เส้นสาย</span><span class="brand-en">Zensai Massage · นวดเพื่อสุขภาพ</span></div>
  </div>
  <div class="brand-line"></div>
</header>
<main class="container">
  <h1 class="page-title">บัตรสะสมแต้ม</h1>

  <div class="skeleton" id="loading" style="height:170px"></div>

  <section class="member" id="card" hidden aria-live="polite">
    <div class="who" id="who"></div>
    <div class="bal"><strong id="bal">0</strong><span>แต้ม</span></div>
    <div class="bar" role="progressbar" aria-label="ความคืบหน้าสู่รางวัลถัดไป" aria-valuemin="0" id="barWrap"><i id="bar"></i></div>
    <div class="goal" id="goal"></div>
  </section>

  <div class="alert alert-error" id="msg" role="alert" hidden></div>

  <div class="rule" id="rule"></div>

  <h2>ประวัติแต้ม</h2>
  <ul class="card" id="hist"><li class="empty">กำลังโหลด...</li></ul>

  <button class="btn btn-primary btn-block" id="bookBtn">จองคิวนวด</button>

  <footer class="site-footer" aria-label="ข้อมูลร้าน" style="margin-top:var(--sp-2)">
    <div class="row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-shop="hours">เปิดทุกวัน 10:00–22:00 น.</span></div>
    <div class="row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><a data-shop="phone" href="tel:0838974088">083-897-4088</a></div>
    <div class="row"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-4.9A8.5 8.5 0 1 1 21 11.5z"/></svg><a data-shop="line" href="https://lin.ee/VCzZf3y">แชต LINE ร้าน</a></div>
  </footer>
</main>

<script>
/* ================== ตั้งค่า ================== */
const CONFIG = {
  LIFF_ID: '2012242488-MQcweAjg',   // LIFF หน้าบัตรสะสมแต้ม
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzGYGDZ9U1p-C6fhe0xOBfk2Kd2uC1qpuZTYIqtyW0Fg2zHU_-hNtagqy3VfTC_7IYmIg/exec',
  BOOKING_URL: 'https://liff.line.me/2012242488-OK0d3lhO/',
  // อัตราแต้ม ของรางวัล เบอร์ และ LINE ร้าน: อ่านจากแท็บ "ตั้งค่า" ที่ส่งมาพร้อมข้อมูลแต้ม
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPE_LABEL = { earn:'ได้รับแต้ม', reverse:'หักคืน (ยกเลิก)', redeem:'แลกของรางวัล', adjust:'ปรับแต้ม' };

$('rule').hidden = true;
$('bookBtn').addEventListener('click', () => { location.href = CONFIG.BOOKING_URL; });

function showError(text){
  $('loading').hidden = true;
  $('msg').textContent = text; $('msg').hidden = false;
  $('hist').innerHTML = '<li class="empty">—</li>';
}

function render(data, name){
  $('loading').hidden = true; $('card').hidden = false;
  $('who').textContent = name ? `คุณ${name}` : 'สมาชิกเส้นสาย';
  $('bal').textContent = data.balance.toLocaleString('th-TH');
  const st = data.settings || {};
  const rate = Number(st.pointsPer100) || 0, goal = Number(st.rewardPoints) || 0, label = st.rewardLabel || '';
  const hasReward = goal > 0 && label;
  $('rule').innerHTML = (rate ? `ทุก 100 บาท รับ <strong>${rate} แต้ม</strong>` : '')
    + (hasReward ? ` · ครบ ${goal.toLocaleString('th-TH')} แต้ม แลก ${esc(label)}` : '')
    + '<br>แต้มเข้าอัตโนมัติหลังใช้บริการเสร็จ';
  $('rule').hidden = false;
  $('barWrap').hidden = !hasReward; $('goal').hidden = !hasReward;
  document.querySelectorAll('[data-shop="hours"]').forEach(el => { if (st.openTime) el.textContent = `เปิดทุกวัน ${st.openTime}–${st.closeTime} น.`; });
  document.querySelectorAll('[data-shop="phone"]').forEach(el => { if (st.phone){ el.textContent = st.phone; el.href = 'tel:' + String(st.phone).replace(/\D/g, ''); } });
  document.querySelectorAll('[data-shop="line"]').forEach(el => { if (st.lineUrl) el.href = st.lineUrl; });
  const inCycle = Math.max(0, data.balance);
  const pct = hasReward ? Math.min(100, inCycle / goal * 100) : 0;
  $('barWrap').setAttribute('aria-valuemax', goal); $('barWrap').setAttribute('aria-valuenow', Math.min(inCycle, goal));
  requestAnimationFrame(() => { $('bar').style.width = pct + '%'; });
  $('goal').textContent = inCycle >= goal
    ? `ครบ ${goal.toLocaleString('th-TH')} แต้มแล้ว! แจ้งพนักงานเพื่อแลก ${label}`
    : `อีก ${(goal - inCycle).toLocaleString('th-TH')} แต้ม แลก ${label}`;

  $('hist').innerHTML = data.history.length ? data.history.map(h => `
    <li><div class="t"><span>${esc(h.note || TYPE_LABEL[h.type] || h.type)}</span>
      <small>${esc(h.date)} · ${esc(TYPE_LABEL[h.type] || h.type)}${h.amount ? ' · ฿' + Number(h.amount).toLocaleString('th-TH') : ''}</small></div>
      <span class="p ${h.points >= 0 ? 'plus' : 'minus'}">${h.points >= 0 ? '+' : ''}${h.points}</span></li>`).join('')
    : '<li class="empty">ยังไม่มีแต้ม ใช้บริการครั้งแรกเพื่อเริ่มสะสม</li>';
}

(async function start(){
  try{
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const [profile, res] = await Promise.all([
      liff.getProfile().catch(() => null),
      fetch(CONFIG.GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'points', accessToken: liff.getAccessToken() })
      }).then(r => r.json())
    ]);
    if (!res.success) throw new Error(res.error || 'โหลดแต้มไม่สำเร็จ');
    render(res, profile && profile.displayName);
  }catch(e){
    console.error(e);
    showError('โหลดข้อมูลแต้มไม่สำเร็จ (' + (e.message || e) + ') กรุณาปิดแล้วเปิดใหม่จากเมนูในแชต LINE ของร้าน หากยังไม่ได้ ติดต่อ 083-897-4088');
  }
})();
</script>
</body>
</html>
